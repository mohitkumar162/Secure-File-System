apiVersion: v1
kind: Service
metadata:
  name: secure-file-system-service
spec:
  # Route traffic to pods matching this label
  selector:
    app: secure-file-system
  ports:
    - protocol: TCP
      port: 80         # Port exposed by the Service
      targetPort: 5000  # Port running inside the container (Flask)
  # LoadBalancer allows the cloud provider to provision an external IP (e.g. AWS ELB)
  type: LoadBalancer
