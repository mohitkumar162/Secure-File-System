version: '3.8'

services:
  web:
    # Build the image using the Dockerfile inside the subdirectory
    build:
      context: ./Secure File Management System
      dockerfile: Dockerfile
    # Map port 5000 of the host to port 5000 of the container
    ports:
      - "5000:5000"
    # Set default environment variables
    environment:
      - FLASK_ENV=development
      - ADMIN_PASSWORD=admin123
      - FLASK_SECRET_KEY=dev-secret-key-12345
      
      # Optional: Add AWS S3 configurations here if needed
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      # - AWS_STORAGE_BUCKET_NAME=your_bucket_name
      
      # Optional: Set a static 32-character encryption key for persistence
      # - ENCRYPTION_KEY=your-32-character-secret-key-12
    volumes:
      # Keep local uploads persisted on your host machine
      - local_uploads:/app/static/uploads

volumes:
  local_uploads:
