name: CI/CD Pipeline

# Trigger this workflow on every push or pull request to the main/master branches
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository files
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Install Python environment in GitHub Actions runner
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Step 3: Install all Python dependencies from requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r "Secure File Management System/requirements.txt"

    # Step 4: Run our unit tests using pytest
    - name: Run tests with pytest
      run: |
        pytest "Secure File Management System"

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test # Only run this job if the tests pass successfully

    steps:
    # Step 1: Check out the repository files
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Verify that Docker can build the container image without errors
    - name: Build Docker image
      run: |
        docker build -t secure-file-system:latest "./Secure File Management System"
